# Docker API — Python 3.12 pinned in the image. For Render Web Service (not Blueprint): create a
# Docker web service, Dockerfile path `Dockerfile`, context `.`, root directory empty (repo root).
services:
  - type: web
    name: eu-ai-act-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: CORS_ALLOW_ORIGINS
        sync: false
