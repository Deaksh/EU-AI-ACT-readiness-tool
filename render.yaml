# API runs as Docker so Python is pinned to 3.12 (native Render Python was resolving to 3.14,
# which lacks pydantic-core wheels and triggers a Rust build that fails on Render).
services:
  - type: web
    name: eu-ai-act-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: CORS_ALLOW_ORIGINS
        sync: false
