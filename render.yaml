# API image lives under backend/ so the repo root has no Dockerfile (Vercel would otherwise
# deploy this image and serve FastAPI — 404 on / for the marketing app).
services:
  - type: web
    name: eu-ai-act-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: CORS_ALLOW_ORIGINS
        sync: false
