# API image under backend/. Repo root has no Dockerfile (Vercel would deploy FastAPI → 404 on /).
#
# Monorepo rule: if Root Directory is "backend", Dockerfile path + docker context are relative to
# backend/ — use ./Dockerfile and .  (NOT backend/Dockerfile — that becomes backend/backend).
services:
  - type: web
    name: eu-ai-act-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: CORS_ALLOW_ORIGINS
        sync: false
