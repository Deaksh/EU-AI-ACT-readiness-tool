# Render Blueprint: FastAPI API (set CORS_ALLOW_ORIGINS to your Vercel URL after deploy)
# IMPORTANT: pydantic-core needs a prebuilt wheel. Use Python 3.11 or 3.12 only — not 3.13+ on
# free builders (3.14 tries to compile Rust and fails on read-only FS). Sync this Blueprint
# after push, or set Environment → PYTHON_VERSION in the dashboard to 3.12.8.
services:
  - type: web
    name: eu-ai-act-api
    runtime: python
    plan: free
    region: oregon
    branch: main
    rootDir: backend
    buildCommand: pip install -U pip setuptools wheel && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: CORS_ALLOW_ORIGINS
        sync: false
